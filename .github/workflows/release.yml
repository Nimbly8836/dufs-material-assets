name: Release

# Push a tag such as `v1.0.0` to build the assets and publish a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: latest
          check-latest: true
          cache: pnpm
          cache-dependency-path: "**/package.json"
      - name: Install dependencies
        run: pnpm install

      # For `dufs --assets <dir>`: index.html, index.js, index.css and
      # vite.svg at the zip root, so `unzip -d <dir>` is ready to use.
      - name: Build assets
        run: |
          DUFS_FLAT_ASSETS=1 pnpm run build
          for f in index.html index.js index.css vite.svg; do
            test -f "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
          out="$PWD/dufs-material-assets-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -qr "$out" .)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dufs-material-assets-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
