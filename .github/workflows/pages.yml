name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress deployment; just queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: latest
          check-latest: true
          cache: pnpm
          cache-dependency-path: "**/package.json"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Resolve latest dufs version
        id: dufs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/sigoden/dufs/releases/latest --jq .tag_name \
            || echo v0.0.0)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Build demo
        env:
          # base_path is "/<repo>" for project pages, "" for a custom domain.
          DEMO_BASE: ${{ steps.pages.outputs.base_path }}/
          DEMO_DUFS_VERSION: ${{ steps.dufs.outputs.version }}
        run: |
          pnpm install
          pnpm run build:demo
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
